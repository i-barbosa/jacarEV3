[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jacarev3"
dynamic = ["version"]
description = "Lib em português pra controlar o LEGO EV3 via Bluetooth — protocolo Direct Commands implementado do zero, sem dependências externas"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Ítalo Vinicius Barbosa Felix" }
]
keywords = ["ev3", "lego", "mindstorms", "robotica", "bluetooth", "educacional"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Education",
    "Topic :: System :: Hardware",
    "Natural Language :: Portuguese (Brazilian)",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[project.urls]
Homepage = "https://github.com/i-barbosa/jacarEV3"
Repository = "https://github.com/i-barbosa/jacarEV3"
Issues = "https://github.com/i-barbosa/jacarEV3/issues"
Changelog = "https://github.com/i-barbosa/jacarEV3/blob/main/CHANGELOG.md"
Documentation = "https://github.com/i-barbosa/jacarEV3/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "jacarev3.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
