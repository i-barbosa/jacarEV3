name: Publicar no PyPI

on:
  push:
    tags:
      - "v*"

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar a lib com extras de desenvolvimento
        run: pip install -e ".[dev]"

      - name: Rodar os testes
        run: pytest -q

      - name: ruff
        run: ruff check src/ tests/

      - name: mypy
        run: mypy src/jacarev3

  build-and-publish:
    needs: testes
    runs-on: ubuntu-latest

    # Trusted Publishing (OIDC) — sem token, o PyPI confia neste workflow.
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar ferramentas de build
        run: pip install build

      - name: Gerar pacote
        run: python -m build

      - name: Publicar no PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
