name: 🐛 Bug
description: Algo não funcionou do jeito esperado
labels: ["bug"]
body:
  - type: textarea
    id: o-que-aconteceu
    attributes:
      label: O que aconteceu
      description: Descreve o comportamento errado. Se der, cola a mensagem de erro inteira.
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: O que você esperava que acontecesse
    validations:
      required: true

  - type: textarea
    id: reproduzir
    attributes:
      label: Como reproduzir
      description: Trecho de código mínimo que mostra o problema.
      render: python
    validations:
      required: true

  - type: dropdown
    id: hardware
    attributes:
      label: Testado com EV3 físico ou só sem robô (ConexaoFalsa/mock)?
      options:
        - EV3 físico
        - Sem robô (só código/testes)
        - Não sei dizer
    validations:
      required: true

  - type: input
    id: versao
    attributes:
      label: Versão do jacarev3
      description: "`python -c \"import jacarev3; print(jacarev3.__version__)\"`"
    validations:
      required: true

  - type: input
    id: sistema
    attributes:
      label: Sistema operacional e versão do Python
      placeholder: "ex: Windows 11, Python 3.11"
    validations:
      required: true
