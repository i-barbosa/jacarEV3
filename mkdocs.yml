site_name: jacarEV3
site_description: Lib em português pra controlar o LEGO EV3 via Bluetooth
site_url: https://i-barbosa.github.io/jacarEV3/
repo_url: https://github.com/i-barbosa/jacarEV3
repo_name: i-barbosa/jacarEV3
docs_dir: docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: pt-BR
  logo: assets/logo.png
  favicon: assets/logo.png
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Modo claro
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tooltips

nav:
  - Início: index.md
  - Básico (som, LED, motor, sensor): basico.md
  - Seguir linha: circuito.md
  - Desviar de obstáculo: desvio.md
  - Controle remoto: controle.md
  - Atividades: atividades.md
  - Respostas: gabaritos.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      title: Nesta página

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/i-barbosa/jacarEV3
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/jacarev3/
